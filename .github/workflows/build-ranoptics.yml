name: Build RanOptics Executables

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build RanOptics on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: RanOptics
            asset_name: RanOptics-Linux
            data_sep: ":"
          - os: windows-latest
            artifact_name: RanOptics.exe
            asset_name: RanOptics-Windows.exe
            data_sep: ";"
          - os: macos-latest
            artifact_name: RanOptics
            asset_name: RanOptics-macOS
            data_sep: ":"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python Dependencies
        # Only what the frozen binary actually bundles. Physics backends
        # (pytao/Bmad, ELEGANT, MAD-X) are NOT installed here — they depend
        # on separately-compiled native libraries (e.g. libtao.so/libbmad.so,
        # normally installed via conda-forge's `bmad` package) that PyInstaller
        # cannot pick up from a pip-only `pytao` install. Users who need a
        # backend install it themselves per docs/installation.md, same as
        # today. kaleido (PNG/PDF export) also needs a separately-managed
        # Chrome install at runtime (`kaleido_get_chrome`) — bundling the
        # Python package does not bundle a browser.
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy plotly PySide6 kaleido

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --noconsole --name RanOptics \
            --collect-all PySide6 --collect-all plotly --collect-all kaleido \
            --add-data "logo${{ matrix.data_sep }}logo" \
            RanOptics.py

      - name: Rename Binary for Asset Upload
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Attach Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
