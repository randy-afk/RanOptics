name: Build RanOptics Executables

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build RanOptics on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: RanOptics
            asset_name: RanOptics-Linux
            data_sep: ":"
          - os: windows-latest
            artifact_name: RanOptics.exe
            asset_name: RanOptics-Windows.exe
            data_sep: ";"
          - os: macos-latest
            artifact_name: RanOptics
            asset_name: RanOptics-macOS
            data_sep: ":"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python Dependencies
        # ELEGANT and MAD-X stay fully external — RanOptics either shells
        # out to the elegant/sddsconvert binaries on PATH, or only parses
        # MAD-X's own output files, so nothing to bundle for either.
        #
        # pytao IS bundled (it's a pure Python/ctypes wrapper, packages
        # cleanly), but the actual compiled Bmad library (libtao.so, from
        # conda-forge's `bmad` package) is NOT and can't reasonably be —
        # it pulls in a long chain of its own native deps (GSL, LAPACK,
        # FFTW3, HDF5...). Users point RanOptics at their own installed
        # library via the "Bmad library" field (core/loaders.py's
        # bmad_lib), which loads it by explicit absolute path — bypassing
        # both PyInstaller's patched ctypes.util.find_library() (which
        # blocks runtime rediscovery of anything not bundled at build
        # time) and the bootloader's LD_LIBRARY_PATH rewrite.
        #
        # xsuite is NOT bundled: load_xsuite()'s build_tracker()/twiss()
        # path JIT-compiles C kernels via cffi at runtime, which needs an
        # actual C compiler on the machine running the binary — a much
        # bigger requirement than "self-contained executable" implies.
        # Confirmed by testing the real load_xsuite() path in a frozen
        # build, not just a trivial import.
        #
        # kaleido (PNG/PDF export) needs a separately-managed Chrome
        # install at runtime (`kaleido_get_chrome`) — bundling the Python
        # package does not bundle a browser. Pinned to 1.2.0: 1.3.0's
        # kaleido.mocker._args module calls argparse.parse_args() at
        # import time, which crashes PyInstaller's --collect-all
        # submodule probing on every OS (SystemExit during
        # collect_submodules). 1.2.0 is verified to build and run cleanly.
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy plotly PySide6 "kaleido==1.2.0" pytao

      - name: Fetch modern OpenSSL for bundling (Linux only)
        # PyInstaller auto-bundles whatever libssl.so.3/libcrypto.so.3 the
        # runner's Python is linked against (Ubuntu's system OpenSSL, capped
        # at symbol version OPENSSL_3.0.x). Python's own ssl/hashlib modules
        # load that bundled copy automatically, early, before the app even
        # shows a window — which permanently claims the libssl.so.3 SONAME
        # for the whole process. When Tao/Bmad is later loaded from a
        # conda-forge install (whose libcurl.so.4 needs OPENSSL_3.2.0+), no
        # amount of preloading in loaders.py can dislodge the SONAME that's
        # already claimed — confirmed by direct reproduction. Fetching
        # conda-forge's own openssl package (the same distribution Bmad
        # itself is built against) and overriding PyInstaller's bundled copy
        # with --add-binary means whichever loads first is already new
        # enough for both Python and Bmad, so there's no race to lose.
        if: runner.os == 'Linux'
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          ./bin/micromamba create -p ./openssl_env -c conda-forge openssl -y

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "${{ runner.os }}" = "Linux" ]; then
            EXTRA_ARGS+=(--add-binary "./openssl_env/lib/libssl.so.3:.")
            EXTRA_ARGS+=(--add-binary "./openssl_env/lib/libcrypto.so.3:.")
          fi
          pyinstaller --onefile --noconsole --name RanOptics \
            --collect-all PySide6 --collect-all plotly --collect-all kaleido --collect-all pytao \
            --add-data "logo${{ matrix.data_sep }}logo" \
            "${EXTRA_ARGS[@]}" \
            RanOptics.py

      - name: Rename Binary for Asset Upload
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Attach Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
